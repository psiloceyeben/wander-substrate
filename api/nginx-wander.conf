# /etc/nginx/sites-available/wander
# certbot will append SSL stanzas + the HTTP→HTTPS redirect server block.

server {
    server_name wanderaround.prometheus7.com;
    server_tokens off;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── Block sensitive file extensions (defense in depth) ───────────
    location ~* \.(json|env|py|log|md|sh|txt|yml|yaml|conf|ini)$ { return 404; }
    location ~ /\.(git|env|ssh|aws) { return 404; }

    # ── Body size cap (placeholder + future API don't need uploads yet) ──
    client_max_body_size 16k;
    client_body_buffer_size 4k;

    # ── Reverse proxy to FastAPI on 127.0.0.1:8050 ───────────────────
    location / {
        proxy_pass         http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
    }

    listen 80;
    listen [::]:80;
}
